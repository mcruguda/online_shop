# Bruno collection URLs: http://localhost/api/v1/...
#
# 1. Open C:\xampp\apache\conf\extra\httpd-vhosts.conf
# 2. Paste this VirtualHost (adjust paths if needed)
# 3. Restart Apache
#
# This sets the shop API document root so paths match Bruno exactly.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/online_shop/public"

    <Directory "C:/xampp/htdocs/online_shop/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
